<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>GALAGA</title>
<!-- Add to Home Screen on iOS launches without Safari chrome. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Galaga">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>&#128126;</text></svg>">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000; color: #fff;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    overflow: hidden; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; touch-action: none;
  }
  #wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px;
  }
  #screen {
    display: block;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #000;
    box-shadow: 0 0 0 2px #1b1b2e, 0 0 60px rgba(60, 90, 255, 0.18);
    max-width: 100vw; max-height: 100vh;
  }
  #hint {
    font-size: 11px; letter-spacing: 0.12em; color: #4a4a63;
    text-align: center; line-height: 1.8; padding: 0 12px;
  }
  #hint b { color: #7a7a9c; font-weight: 600; }
  @media (max-height: 640px) { #hint { display: none; } }
  /* Touch controls: only shown on coarse pointers */
  #touch { display: none; }
  @media (pointer: coarse) {
    #touch {
      display: flex; position: fixed; left: 0; right: 0; bottom: 0;
      height: calc(24vh + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      align-items: stretch; z-index: 5;
    }
    /* Tint with background rather than `opacity`, so the glyph stays legible. */
    #touch div {
      flex: 1; margin: 6px; border-radius: 14px;
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.45);
      display: flex; align-items: center; justify-content: center;
      font-size: 26px; line-height: 1;
      transition: background 60ms linear, color 60ms linear;
    }
    #touch div.on {
      background: rgba(120, 190, 255, 0.28);
      color: rgba(255, 255, 255, 0.9);
    }
    /* Reserve the control strip so the playfield is never underneath it. */
    #wrap { padding-bottom: calc(24vh + env(safe-area-inset-bottom)); }
    #hint { display: none; }
  }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="screen" width="224" height="288"></canvas>
    <div id="hint">
      <b>&larr; &rarr;</b> or <b>A D</b> move &nbsp;&middot;&nbsp; <b>SPACE</b> fire &nbsp;&middot;&nbsp; <b>ENTER</b> start<br>
      <b>P</b> pause &nbsp;&middot;&nbsp; <b>M</b> mute &nbsp;&middot;&nbsp; <b>F</b> fullscreen
    </div>
  </div>
  <div id="touch" aria-hidden="true">
    <div data-key="left">&#9664;</div><div data-key="fire">&#9650;</div><div data-key="right">&#9654;</div>
  </div>

  <script src="src/util.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/sprites.js"></script>
  <script src="src/stars.js"></script>
  <script src="src/paths.js"></script>
  <script src="src/entities.js"></script>
  <script src="src/stages.js"></script>
  <script src="src/hud.js"></script>
  <script src="src/game.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
