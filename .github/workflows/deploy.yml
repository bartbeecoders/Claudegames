# Publishes the game to GitHub Pages.
#
# Nothing is compiled — the repository root is already a working static site,
# so it is uploaded as-is alongside each game's single-file bundle.
#
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # One self-contained <game>/dist/<game>.html per game, published
      # alongside the multi-file version it was built from.
      - name: Build the single-file bundles
        run: npm run build

      - name: Verify the sources parse
        run: npm run check

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
