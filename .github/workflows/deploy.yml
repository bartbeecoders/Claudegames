# Publishes the game to GitHub Pages.
#
# Nothing is compiled — the repository root is already a working static site,
# so it is uploaded as-is alongside the single-file bundle at /galaga.html.
#
# No manual setup: configure-pages runs with `enablement: true`, so the first
# run turns Pages on and points it at Actions by itself.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Produces galaga/dist/galaga.html, published as /galaga/dist/galaga.html.
      - name: Build the single-file bundles
        run: npm run build

      - name: Verify the sources parse
        run: npm run check

      # enablement: true creates the Pages site on first run, so the repository
      # needs no manual Settings -> Pages step.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
